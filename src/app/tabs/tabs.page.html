<ion-tabs>
  <ion-tab-bar slot="bottom">
    <!-- Pestaña 1: Inicio -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Pestaña 2: Menú -->
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="restaurant-outline"></ion-icon>
      <ion-label>Menú</ion-label>
    </ion-tab-button>

    <!-- Carrito (con contador de productos) -->
    <ion-tab-button tab="carrito" href="/tabs/carrito">
      <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
      <ion-label>Carrito</ion-label>
      @if (cart.totalItems() > 0) {
        <ion-badge>{{ cart.totalItems() }}</ion-badge>
      }
    </ion-tab-button>

    <!-- Pestaña 3: Reservas -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="calendar-outline"></ion-icon>
      <ion-label>Reservas</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
